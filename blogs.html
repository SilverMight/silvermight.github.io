---
layout: default
title: Blog
---
<div class="blog-posts">
  <h1>All Blog Posts</h1>
  {% for post in site.posts %}
    <div class="post">
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <p>{{ post.excerpt }}</p>
      <p><small>Published on: {{ post.date | date: "%B %d, %Y" }}</small></p>
    </div>
  {% endfor %}
</div>
